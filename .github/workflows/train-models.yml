name: AGRONEX - entrenamiento ML y DL
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-models.yml"
      - "ml/train.py"
      - "backend/app/dl_service.py"
      - "backend/app/dl_inference.py"
      - "data/export_power.py"
  workflow_dispatch:
    inputs:
      latitude:
        description: "Latitud de la región piloto"
        required: true
        default: "-9.93"
      longitude:
        description: "Longitud de la región piloto"
        required: true
        default: "-76.24"
      start:
        description: "Fecha inicial YYYYMMDD"
        required: true
        default: "20210101"
      end:
        description: "Fecha final YYYYMMDD"
        required: true
        default: "20251231"
permissions:
  contents: write
jobs:
  training:
    name: Entrenamiento y métricas
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ml.txt
      - name: Instalar herramientas de ML / DL
        run: pip install -r backend/requirements-ml.txt
      - name: Exportar observaciones NASA POWER
        env:
          LAT: ${{ inputs.latitude || '-9.93' }}
          LON: ${{ inputs.longitude || '-76.24' }}
          START: ${{ inputs.start || '20210101' }}
          END: ${{ inputs.end || '20251231' }}
        run: python data/export_power.py --latitude "$LAT" --longitude "$LON" --start "$START" --end "$END" --out data/power_daily.csv
      - name: Entrenar Random Forest
        run: python ml/train.py --csv data/power_daily.csv --out backend/artifacts/weather_rf.joblib
      - name: Entrenar LSTM
        run: python backend/app/dl_service.py --csv data/power_daily.csv --out backend/artifacts/weather_lstm.pt
      - name: Exportar reporte de evaluación
        run: python ml/report.py --ml backend/artifacts/weather_rf.joblib --dl backend/artifacts/weather_lstm.pt --out backend/artifacts/metrics.json
      - name: Publicar pesos experimentales validados por evaluación temporal
        run: |
          git config user.name "AGRONEX training bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/artifacts/weather_rf.joblib backend/artifacts/weather_lstm.npz backend/artifacts/metrics.json
          git commit -m "chore(models): actualizar pesos y métricas NASA POWER [skip ci]"
          git push origin HEAD:main
      - name: Guardar modelos entrenados y métricas
        uses: actions/upload-artifact@v4
        with:
          name: agronex-modelos-experimentales
          path: backend/artifacts/
          retention-days: 14
          if-no-files-found: error
